
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise | Budget Tracker</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="container">
        <header class="page-header">
            <h1>SpendWise</h1>
            <p>Your personal budget and expense tracker</p>
        </header>

        <section class="panel">
            <h2>Monthly Budget</h2>

            <form id="budgetForm">
                <label for="budgetInput">Budget amount (KSh)</label>
                <input
                    type="number"
                    id="budgetInput"
                    min="0.01"
                    step="0.01"
                    placeholder="Enter your monthly budget"
                    required
                >
                <button type="submit">Save Budget</button>
            </form>
        </section>

        <section class="dashboard">
            <article class="summary-card">
                <h3>Monthly Budget</h3>
                <p id="budgetDisplay">KSh 10,000</p>
            </article>

            <article class="summary-card">
                <h3>Total Expenses</h3>
                <p id="totalDisplay">KSh 0</p>
            </article>

            <article class="summary-card">
                <h3>Remaining Balance</h3>
                <p id="balanceDisplay">KSh 10,000</p>
            </article>
        </section>

        <p id="feedback" role="status" aria-live="polite">
            Welcome to SpendWise!
        </p>

        <section class="panel">
            <h2>Add an Expense</h2>

            <form id="expenseForm">
                <label for="expenseName">Expense name</label>
                <input
                    type="text"
                    id="expenseName"
                    placeholder="e.g. Groceries"
                    maxlength="100"
                    required
                >

                <label for="expenseAmount">Amount (KSh)</label>
                <input
                    type="number"
                    id="expenseAmount"
                    placeholder="e.g. 2500"
                    min="0.01"
                    step="0.01"
                    required
                >

                <label for="expenseCategory">Category</label>
                <select id="expenseCategory" required>
                    <option value="">Choose a category</option>
                    <option value="Food">Food</option>
                    <option value="Transport">Transport</option>
                    <option value="Rent">Rent</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Savings">Savings</option>
                    <option value="Utilities">Utilities</option>
                    <option value="Other">Other</option>
                </select>

                <button type="submit">Add Expense</button>
            </form>
        </section>

        <section class="panel">
            <h2>Your Expenses</h2>

            <p id="expenseCount">You have 0 expenses.</p>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Category</th>
                            <th>Amount</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="expenseTableBody">
                    </tbody>
                </table>
            </div>

            <button type="button" id="clearButton" class="danger-button">
                Clear All Expenses
            </button>
        </section>

        <footer>
            <p>SpendWise — Make every shilling count.</p>
        </footer>
    </main>
</body>
</html>
